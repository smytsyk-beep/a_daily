name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: astrodaily
          POSTGRES_USER: astrodaily
          POSTGRES_PASSWORD: astrodaily
        options: >-
          --health-cmd="pg_isready -U astrodaily -d astrodaily"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:

      DATABASE_URL: postgresql+psycopg2://astrodaily:astrodaily@localhost:5432/astrodaily
      APP_ENV: test
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic psycopg2-binary pre-commit

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import time, socket
          host, port = "localhost", 5432
          for _ in range(60):
              try:
                  with socket.create_connection((host, port), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Postgres not reachable")
          print("Postgres reachable")
          PY

      - name: Run pre-commit
        # Если не хочешь падения пайплайна из-за автофикс-хуков — раскомментируй строку ниже:
        # continue-on-error: true
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run Alembic migrations
        run: |

          sed -i 's#^sqlalchemy.url = .*$#sqlalchemy.url = '"$DATABASE_URL"'#' alembic.ini
          alembic -c alembic.ini upgrade head

      - name: Run tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: astrodaily
          PGPASSWORD: astrodaily
        run: pytest -q tests
