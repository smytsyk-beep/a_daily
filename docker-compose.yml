services:
  app:
    build: .
    image: astrodaily/app:dev
    container_name: astrodaily_app
    env_file: .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: astrodaily_db
    environment:
      POSTGRES_DB: astrodaily
      POSTGRES_USER: astrodaily
      POSTGRES_PASSWORD: astrodaily
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrodaily -d astrodaily"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nominatim для geocoding (опционально, можно использовать nominatim.org)
  # Раскомментируйте для self-hosted geocoding
  # nominatim:
  #   image: mediagis/nominatim:4.4
  #   container_name: astrodaily_nominatim
